[package]
name = "guntamatic-modbus"
version = "0.1.0"
authors = ["swimmes <wimmesberger@gmail.com>"]
edition = "2021"

[lib]
name = "guntamatic_modbus"
path = "src/lib.rs"

[dependencies]
guntamatic-core = { path = "../guntamatic-core" }

# Async trait support
async-trait = "0.1"

# Modbus TCP client
tokio-modbus = "0.16"

# Async runtime
tokio = { version = "1.37", features = ["net", "time"] }

# HTTP client for mapping fetch
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# HTML parsing for mbmap.cgi
scraper = "0.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
