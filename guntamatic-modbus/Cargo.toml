[package]
name = "guntamatic-modbus"
version = "0.1.0"
authors = ["swimmes <wimmesberger@gmail.com>"]
edition = "2024"
description = "Modbus/TCP client for Guntamatic heating devices"
repository = "https://github.com/swimmes/guntamatic"
license = "MIT OR Apache-2.0"
keywords = ["guntamatic", "modbus", "iot", "monitoring"]
categories = ["hardware-support", "network-programming"]

[lib]
name = "guntamatic_modbus"
path = "src/lib.rs"

[dependencies]
guntamatic-core = { path = "../guntamatic-core" }

# Modbus TCP client
tokio-modbus = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["net", "time"] }

# HTTP client for mapping fetch
reqwest = { workspace = true, features = ["rustls-no-provider", "webpki-roots"] }

# HTML parsing for mbmap.cgi
scraper = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
log = { workspace = true }
