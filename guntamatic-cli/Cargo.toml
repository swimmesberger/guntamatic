[package]
name = "guntamatic-cli"
version = "0.3.0"
authors = ["swimmes <wimmesberger@gmail.com>", "geropl <gero.posmyk-leinemann@typefox.io>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "guntamatic"
path = "src/main.rs"

[features]
default = ["sink_influxdb"]
sink_influxdb = ["influxdb2"]
# sink_prometheus = ["prometheus", "warp"]


[dependencies]
guntamatic-core = { path = "../guntamatic-core" }
guntamatic-web = { path = "../guntamatic-web" }
guntamatic-modbus = { path = "../guntamatic-modbus" }

clap = { version = "4.5", features = ["env", "derive"] }

# error handling
anyhow = "1.0"
thiserror = "1.0"

# logging
pretty_env_logger = "0.5"
log = "0.4"

# runtime + support
tokio = { version = "1.37", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
ctrlc = "3.4"
flume = "0.11"

# # sink_prometheus
# prometheus = { version = "0.11.0", optional = true }
# warp = { version = "0.3.0", optional = true }

# sink_influxdb
influxdb2 = { version = "0.5", features = ["rustls"], default-features = false, optional = true }

# misc
hex = "0.4"
pretty_assertions = "1.4"
lazy_static = "1.4"
regex = "1.10"
